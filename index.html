<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Community Episode Guesser</title>
  <meta name="description" content="Guess the Community episode from a single frame.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <main class="game">
      <header><h1>Community Episode Guesser</h1></header>
      <div class="placeholder" role="img" aria-label="Test image placeholder"><span>TEST</span></div>
      <form id="guess-form" class="guess-area" aria-label="Episode guessing">
        <div class="search-wrap">
          <input id="episode-input" type="text" placeholder="Guess the episode..." autocomplete="off" aria-label="Guess the episode" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" role="combobox">
          <div id="suggestions" class="suggestions" role="listbox" hidden></div>
        </div>
        <button type="submit" id="guess-btn" class="guess">Guess</button>
        <div class="score">Score: <span id="score">0</span><br>High Score: <span id="high-score">0</span></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script src="js/episodes.js"></script>
  <script src="js/images.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
