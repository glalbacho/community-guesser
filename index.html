<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191b1d">
  <title>Community Episode Guesser</title>
  <meta name="description" content="Guess a Community episode from screenshots across all six seasons.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open challenges" aria-controls="challenge-menu" aria-expanded="false"><span aria-hidden="true">☰</span></button>
    <div class="menu-backdrop" id="menu-backdrop" hidden></div>
    <aside class="challenge-menu" id="challenge-menu" aria-label="Challenges" aria-hidden="true">
      <div class="menu-head"><div><span class="menu-eyebrow">COMMUNITY GUESSER</span><h2>Challenges</h2></div><button type="button" id="menu-close" class="menu-close" aria-label="Close menu">×</button></div>
      <p class="menu-intro">Choose how you want to play.</p>
      <nav class="challenge-list" aria-label="Choose a challenge">
        <button type="button" data-challenge="classic" class="challenge-link active"><span>Classic game</span><small>Easy · Normal · Hard · Impossible</small></button>
        <button type="button" data-challenge="season" class="challenge-link"><span>Season Challenge</span><small>Play one season at a time</small></button>
        <button type="button" data-challenge="daily" class="challenge-link"><span>Daily Challenge</span><small>Five shared screenshots every UTC day</small></button>
        <button type="button" data-challenge="one110" class="challenge-link"><span>One Life, 110</span><small>Every episode exactly once. One mistake ends it.</small></button>
        <button type="button" data-challenge="four" class="challenge-link"><span>Four Choices</span><small>Pick the episode out of four</small></button>
        <button type="button" data-challenge="timeline" class="challenge-link"><span>Timeline Challenge</span><small>Put three episodes in broadcast order</small></button>
        <button type="button" data-challenge="progressive" class="challenge-link"><span>Progressive Reveal</span><small>Sharpen the picture · fewer hints, more points</small></button>
        <button type="button" data-challenge="survival" class="challenge-link"><span>Survival Mode</span><small>Three lives, one long streak</small></button>
      </nav>
    </aside>
    <main class="game">
      <header><h1>Community Episode Guesser</h1><p id="challenge-subtitle" class="challenge-subtitle" hidden></p></header>
      <div id="challenge-tools" class="challenge-tools" hidden>
        <label id="season-label" for="season-select" hidden>Season <select id="season-select" aria-label="Choose a season">
          <option value="1">Season 1</option><option value="2">Season 2</option><option value="3">Season 3</option><option value="4">Season 4</option><option value="5">Season 5</option><option value="6">Season 6</option>
        </select></label>
        <span class="progress-detail" id="progress-detail" aria-live="polite"></span>
      </div>
      <div class="frame-viewer" id="frame-viewer">
        <div class="placeholder" id="episode-frame"><span>TEST</span></div>
        <nav class="frame-navigation" id="frame-navigation" aria-label="Screenshot navigation" hidden>
          <button type="button" class="frame-arrow" id="previous-frame" aria-label="Previous screenshot" title="Previous screenshot"><span aria-hidden="true">&#8249;</span></button>
          <span class="frame-counter" id="frame-counter" aria-live="polite">1 / 3</span>
          <button type="button" class="frame-arrow" id="next-frame" aria-label="Next screenshot" title="Next screenshot"><span aria-hidden="true">&#8250;</span></button>
        </nav>
      </div>
      <div id="reveal-controls" class="reveal-controls" hidden>
        <span id="reveal-label">Reveal 1 / 5</span><button type="button" id="reveal-next">Reveal more <span aria-hidden="true">›</span></button>
      </div>
      <section class="timeline-board" id="timeline-board" aria-label="Place screenshots in episode order" hidden>
        <p>Tap two pictures to swap them. Arrange from earliest to latest episode.</p>
        <div class="timeline-cards" id="timeline-cards"></div>
        <button type="button" id="timeline-submit" class="primary-action">Check order</button>
      </section>
      <form id="guess-form" class="guess-area" aria-label="Episode guessing">
        <div id="text-answer">
          <div class="search-wrap">
            <input id="episode-input" type="text" placeholder="Guess the episode..." autocomplete="off" aria-label="Guess the episode" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" role="combobox">
            <div id="suggestions" class="suggestions" role="listbox" hidden></div>
          </div>
          <button type="submit" id="guess-btn" class="guess">Guess</button>
        </div>
        <div id="four-choices" class="four-choices" aria-label="Choose one of four episodes" hidden></div>
        <div class="score">Score: <span id="score">0</span><br><span id="high-score-label">High Score</span>: <span id="high-score">0</span></div>
        <div class="mode-picker" id="mode-picker">
          <label for="game-mode">Game Mode</label>
          <select id="game-mode" name="game-mode">
            <option value="easy">Easy Mode</option>
            <option value="normal">Normal Mode</option>
            <option value="hard">Hard Mode</option>
            <option value="impossible">Impossible Mode</option>
          </select>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button type="button" id="restart-challenge" class="restart-challenge" hidden>Play again</button>
      </form>
    </main>
  </div>
  <script src="js/episodes.js"></script>
  <script src="js/images.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
