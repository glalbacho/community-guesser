<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Guesser</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header"><h1>Community Guesser</h1></header>
    <main class="game">
      <div class="screen"><div class="placeholder">TEST</div></div>
      <form id="guess-form" autocomplete="off">
        <div class="search-wrap">
          <input id="episode-input" type="text" aria-label="Guess the episode" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" placeholder="Guess the episode..." spellcheck="false">
          <div id="suggestions" class="suggestions" role="listbox" hidden></div>
        </div>
        <button class="guess-button" type="submit">Guess</button>
      </form>
      <div class="scores"><div>Score: <span id="score">0</span></div><div>High Score: <span id="high-score">0</span></div></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </main>
    <footer><a href="impressum/">Impressum</a></footer>
  </div>
  <script src="js/episodes.js"></script><script src="js/game.js"></script>
</body>
</html>
